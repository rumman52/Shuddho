[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shuddho"
version = "0.1.0"
description = "Bangla AI writing assistant MVP scaffold"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "httpx>=0.27.0",
  "google-genai>=1.75.0,<2.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.2.0,<9.0.0"
]

[project.optional-dependencies]
coworker = [
  "sqlalchemy>=2.0.43,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "cryptography>=45,<51",
  "boto3>=1.40,<2.0",
  "temporalio>=1.16,<2.0",
  "python-docx>=1.2,<2.0",
  "python-pptx>=1.0,<2.0",
  "XlsxWriter>=3.2,<4.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=6.0,<7.0",
  "weasyprint>=66,<70"
]
ml = [
  "sentencepiece>=0.2.0,<1.0.0",
  "torch>=2.5.1,<3.0.0; sys_platform == 'win32'",
  "torch>=2.4.0,<3.0.0; sys_platform != 'win32'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*", "ml*"]
exclude = [
  "apps*",
  "data*",
  "docs*",
  "node_modules*",
  "scripts*",
  "tests*",
  "services.suggestion-manager*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["coworker_integration: requires a PostgreSQL or Temporal test service"]

[tool.setuptools.package-data]
"services.coworker" = ["migrations/script.py.mako"]

[tool.uv]
default-groups = ["dev"]
