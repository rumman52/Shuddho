[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shuddho"
version = "0.1.0"
description = "Bangla AI writing assistant MVP scaffold"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "pytest>=8.2.0,<9.0.0",
  "torch>=2.5.1,<3.0.0; sys_platform == 'win32'",
  "torch>=2.4.0,<3.0.0; sys_platform != 'win32'",
  "sentencepiece>=0.2.0,<1.0.0",
  "httpx>=0.27.0",
  "google-genai>=1.27.0,<2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*", "ml*"]
exclude = [
  "apps*",
  "data*",
  "docs*",
  "node_modules*",
  "scripts*",
  "tests*",
  "services.suggestion-manager*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
