<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rukh AI — Your workspace for writing and work</title>
    <meta
      name="description"
      content="Rukh AI brings focused multilingual writing and persistent AI work execution into one considered workspace."
    />
    <meta name="application-name" content="Rukh AI" />
    <meta name="theme-color" content="#6257d9" />
    <meta name="color-scheme" content="light" />

    <!-- DM Sans (UI) + Noto Serif Bengali (writing surface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Self-contained SVG favicon: white lowercase r on the Rukh AI brand violet. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%236257d9'/%3E%3Ctext%20x='32'%20y='46'%20font-size='44'%20font-weight='700'%20text-anchor='middle'%20fill='white'%20font-family='system-ui'%3Er%3C/text%3E%3C/svg%3E" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rukh AI" />
    <meta property="og:title" content="Rukh AI — Your workspace for writing and work" />
    <meta
      property="og:description"
      content="A focused workspace for multilingual writing and persistent AI work across documents, conversations and connected tools."
    />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rukh AI — Your workspace for writing and work" />
    <meta
      name="twitter:description"
      content="A focused workspace for multilingual writing and persistent AI work across documents, conversations and connected tools."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
