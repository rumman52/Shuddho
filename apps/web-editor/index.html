<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shuddho — AI Bangla Writing Assistant</title>
    <meta
      name="description"
      content="Shuddho is an AI-powered Bangla writing assistant that checks spelling, grammar, punctuation, and clarity as you type — with a private local engine that keeps working when the network doesn't."
    />
    <meta name="application-name" content="Shuddho" />
    <meta name="theme-color" content="#5b35d5" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://shuddho-web-editor.vercel.app/" />

    <!-- Inter (UI) + Noto Serif Bengali (writing surface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Self-contained SVG favicon: white "শ" on the Shuddho brand purple. No extra asset request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%235b35d5'/%3E%3Ctext%20x='32'%20y='45'%20font-size='40'%20text-anchor='middle'%20fill='white'%20font-family='Noto%20Sans%20Bengali,%20system-ui,%20sans-serif'%3E%E0%A6%B6%3C/text%3E%3C/svg%3E"
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shuddho" />
    <meta property="og:title" content="Shuddho — AI Bangla Writing Assistant" />
    <meta
      property="og:description"
      content="Catch Bangla spelling, grammar, punctuation, and clarity issues in real time. AI deep review with a private local fallback."
    />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Shuddho — AI Bangla Writing Assistant" />
    <meta
      name="twitter:description"
      content="Catch Bangla spelling, grammar, punctuation, and clarity issues in real time. AI deep review with a private local fallback."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
