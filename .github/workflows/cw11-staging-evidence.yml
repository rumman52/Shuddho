name: CW-11 staging evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CW11-STAGING to run the protected staging evidence gate
        required: true
        default: "NO"
      expected_publication_version:
        description: Exact reviewed publication selected in staging
        required: true
      old_source_revision:
        description: Exact legacy worker revision that was drained
        required: true
      old_worker_service_id:
        description: Render service ID for the legacy staging worker
        required: true
      candidate_worker_service_id:
        description: Render service ID for the candidate staging worker
        required: true

permissions:
  contents: read

concurrency:
  group: cw11-staging-evidence
  cancel-in-progress: false

jobs:
  evidence:
    if: ${{ inputs.confirm == 'CW11-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    env:
      SHUDDHO_COWORKER_ENV: staging
      SHUDDHO_COWORKER_DATABASE_URL: ${{ secrets.SHUDDHO_STAGING_DATABASE_URL }}
      SHUDDHO_AUTH_ISSUER: ${{ secrets.SHUDDHO_STAGING_AUTH_ISSUER }}
      # The collector is DB/read-only. Keep the non-secret staging
      # storage shape required by Settings without granting storage credentials to CI.
      SHUDDHO_COWORKER_STORAGE: s3
      SHUDDHO_COWORKER_BUCKET: shuddho-coworker-staging
      SHUDDHO_COWORKER_S3_ENDPOINT: https://bsmbvjenpvcyfjzwtuax.storage.supabase.co/storage/v1/s3
      AWS_DEFAULT_REGION: us-west-1
      SHUDDHO_TEMPORAL_TASK_QUEUE: shuddho-documents-v1
      # The candidate worker, not this read-only collector, is required to run
      # the selected reviewed publication.
      SHUDDHO_AGENT_REVIEWED_RESEARCH_SKILL_ENABLED: "false"
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_WORKSPACE_ID: tea-d6ok4okhg0os73erkdv0

    steps:
      - name: Checkout exact qualification revision
        uses: actions/checkout@v4

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked coworker dependencies
        run: uv sync --frozen --extra coworker --group dev

      - name: Apply pending staging migrations
        run: uv run --extra coworker python -m services.coworker.migrate

      - name: Verify live Render mixed-version drain state
        shell: bash
        env:
          OLD_WORKER_SERVICE_ID: ${{ inputs.old_worker_service_id }}
          CANDIDATE_WORKER_SERVICE_ID: ${{ inputs.candidate_worker_service_id }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1"
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")

          if [[ "${OLD_WORKER_SERVICE_ID}" == "${CANDIDATE_WORKER_SERVICE_ID}" ]]; then
            echo "::error::Old and candidate worker service IDs must differ."
            exit 1
          fi

          old_service="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${OLD_WORKER_SERVICE_ID}")"
          candidate_service="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${CANDIDATE_WORKER_SERVICE_ID}")"

          jq -e --arg owner "${RENDER_WORKSPACE_ID}" '
            .type == "background_worker"
            and .ownerId == $owner
            and .repo == "https://github.com/rumman52/Shuddho"
            and .serviceDetails.region == "oregon"
            and .branch == "main"
          ' <<<"${old_service}" >/dev/null

          jq -e --arg owner "${RENDER_WORKSPACE_ID}" --arg branch "${GITHUB_REF_NAME}" '
            .type == "background_worker"
            and .ownerId == $owner
            and .repo == "https://github.com/rumman52/Shuddho"
            and .serviceDetails.region == "oregon"
            and .branch == $branch
          ' <<<"${candidate_service}" >/dev/null

          old_instances="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${OLD_WORKER_SERVICE_ID}/instances")"
          candidate_instances="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${CANDIDATE_WORKER_SERVICE_ID}/instances")"
          old_deploys="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${OLD_WORKER_SERVICE_ID}/deploys?limit=20")"
          candidate_deploys="$(curl --fail --silent --show-error "${auth[@]}" "${api}/services/${CANDIDATE_WORKER_SERVICE_ID}/deploys?limit=20")"

          old_count="$(jq 'length' <<<"${old_instances}")"
          candidate_count="$(jq 'length' <<<"${candidate_instances}")"

          old_commit="$(jq -r '
            map(select(.status == "live" and (.commit.id? | type == "string")))
            | sort_by(.createdAt)
            | last
            | .commit.id // empty
          ' <<<"${old_deploys}")"

          candidate_commit="$(jq -r '
            map(select(.status == "live" and (.commit.id? | type == "string")))
            | sort_by(.createdAt)
            | last
            | .commit.id // empty
          ' <<<"${candidate_deploys}")"

          if [[ "${old_count}" -ne 0 ]]; then
            echo "::error::Legacy Render worker still has live instances; drain is not complete."
            exit 1
          fi
          if [[ "${old_commit}" != "${{ inputs.old_source_revision }}" ]]; then
            echo "::error::Legacy Render worker live deploy does not match the declared old source revision."
            exit 1
          fi
          if [[ "${candidate_count}" -lt 1 ]]; then
            echo "::error::Candidate Render worker has no live instances."
            exit 1
          fi
          if [[ "${candidate_commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Candidate Render worker is not running the exact qualification revision."
            exit 1
          fi

          jq -n             --arg old_service "${OLD_WORKER_SERVICE_ID}"             --arg candidate_service "${CANDIDATE_WORKER_SERVICE_ID}"             --arg old_revision "${{ inputs.old_source_revision }}"             --arg old_commit "${old_commit}"             --arg candidate_commit "${candidate_commit}"             --argjson old_count "${old_count}"             --argjson candidate_count "${candidate_count}"             '{
              schema_version: 1,
              old_worker_service_id: $old_service,
              candidate_worker_service_id: $candidate_service,
              old_source_revision: $old_revision,
              old_worker_live_commit: $old_commit,
              old_worker_instance_count: $old_count,
              candidate_worker_instance_count: $candidate_count,
              candidate_live_commit: $candidate_commit,
              verified: true
            }' > /tmp/cw11-render-evidence.json

      - name: Collect CW-11 staging evidence
        run: |
          set -euo pipefail
          uv run --extra coworker python scripts/cw11_staging_evidence.py             --expected-publication-version "${{ inputs.expected_publication_version }}"             --old-source-revision "${{ inputs.old_source_revision }}"             --external-render-evidence /tmp/cw11-render-evidence.json             --output /tmp/cw11-staging-evidence.json

      - name: Publish evidence summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /tmp/cw11-render-evidence.json ]]; then
            echo "## CW-11 Render worker evidence" >> "${GITHUB_STEP_SUMMARY}"
            cat /tmp/cw11-render-evidence.json >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f /tmp/cw11-staging-evidence.json ]]; then
            {
              echo "## CW-11 staging evidence"
              echo ""
              cat /tmp/cw11-staging-evidence.json
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw11-staging-evidence
          path: |
            /tmp/cw11-render-evidence.json
            /tmp/cw11-staging-evidence.json
          if-no-files-found: error
          retention-days: 30
