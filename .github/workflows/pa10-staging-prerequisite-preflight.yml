name: PA-10 staging prerequisite preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_gate:
    if: ${{ github.repository == 'rumman52/Shuddho' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate without persisted GitHub credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected exact-head CI before staging credentials
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m scripts.pa10_source_gate \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}"
  preflight:
    if: ${{ needs.source_gate.result == 'success' && github.repository == 'rumman52/Shuddho' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: source_gate
    environment: pa10-staging
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.PA10_RENDER_API_KEY }}
      RENDER_WORKSPACE_ID: tea-d6ok4okhg0os73erkdv0
      RENDER_CLI_DISABLE_ANALYTICS: "1"
      SHUDDHO_COWORKER_ENV: staging
      SHUDDHO_AUTH_ISSUER: https://bsmbvjenpvcyfjzwtuax.supabase.co/auth/v1
      SHUDDHO_AUTH_AUDIENCE: authenticated
      SHUDDHO_TEMPORAL_ADDRESS: ${{ secrets.PA10_TEMPORAL_ADDRESS }}
      SHUDDHO_TEMPORAL_NAMESPACE: ${{ secrets.PA10_TEMPORAL_NAMESPACE }}
      SHUDDHO_TEMPORAL_API_KEY: ${{ secrets.PA10_TEMPORAL_API_KEY }}
      SHUDDHO_STAGING_S3_ACCESS_KEY_ID: ${{ secrets.PA10_STAGING_S3_ACCESS_KEY_ID }}
      SHUDDHO_STAGING_S3_SECRET_ACCESS_KEY: ${{ secrets.PA10_STAGING_S3_SECRET_ACCESS_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.PA10_DEEPSEEK_API_KEY }}
      SHUDDHO_TEMPORAL_TLS: "true"
      SHUDDHO_TEMPORAL_TASK_QUEUE: shuddho-documents-v1
      SHUDDHO_COWORKER_STORAGE: s3
      SHUDDHO_COWORKER_BUCKET: shuddho-coworker-staging
      SHUDDHO_COWORKER_S3_ENDPOINT: https://bsmbvjenpvcyfjzwtuax.storage.supabase.co/storage/v1/s3
      AWS_DEFAULT_REGION: us-west-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard staging-only execution
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "rumman52/Shuddho" ]]; then
            echo "::error::This workflow is restricted to rumman52/Shuddho."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::PA-10 staging preflight must run from main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Render access before preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::BLOCKED_EXTERNAL — RENDER_API_KEY REQUIRED"
            exit 1
          fi

      - name: Install pinned Render CLI
        shell: bash
        run: |
          set -euo pipefail
          version="2.28.0"
          asset="cli_${version}_linux_amd64.zip"
          base="https://github.com/render-oss/cli/releases/download/v${version}"
          cli_dir="$(mktemp -d "${RUNNER_TEMP}/render-cli.XXXXXX")"
          trap 'rm -rf "${cli_dir}"' EXIT
          cd "${cli_dir}"
          curl -fsSLO "${base}/${asset}"
          curl -fsSLO "${base}/cli_${version}_SHA256SUMS"
          grep "  ${asset}$" "cli_${version}_SHA256SUMS" | sha256sum -c -
          unzip -q "${asset}"
          sudo install -m 0755 "cli_v${version}" /usr/local/bin/render
          render --version

      - name: Select reviewed Render workspace
        shell: bash
        run: |
          set -euo pipefail
          render workspace set "${RENDER_WORKSPACE_ID}" --output text

      - name: Validate reviewed staging Blueprint
        shell: bash
        run: |
          set -euo pipefail
          render blueprints validate infra/render.staging.yaml --workspace "${RENDER_WORKSPACE_ID}" --output text

      - name: Resolve private Render Postgres URL
        id: postgres
        shell: bash
        run: |
          set -euo pipefail
          pg_json="$(render pg get shuddho-staging-db --include-sensitive-connection-info --output json)"
          db_url="$(jq -r '.data.connectionInfo.internalConnectionString // empty' <<<"${pg_json}")"
          if [[ -z "${db_url}" || "${db_url}" != postgres*://* ]]; then
            echo "::error::Could not resolve the private shuddho-staging-db connection string."
            exit 1
          fi
          echo "::add-mask::${db_url}"
          {
            echo "database_url<<EOF"
            echo "${db_url}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate staging prerequisites without provisioning
        shell: bash
        env:
          SHUDDHO_COWORKER_DATABASE_URL: ${{ steps.postgres.outputs.database_url }}
        run: |
          set -euo pipefail
          python scripts/staging_prerequisite_preflight.py --output "${RUNNER_TEMP}/pa10-staging-preflight.json"

      - name: Emit non-secret readiness summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### PA-10 staging prerequisite preflight"
            echo ""
            echo "- Required GitHub Actions secrets: present"
            printf '%s\n' '- Environment marker: `staging`'
            echo "- PostgreSQL URL: valid shape (connection not tested)"
            echo "- Managed-auth issuer: valid HTTPS shape (provider reachability not tested)"
            printf '%s\n' '- Auth audience: `authenticated`'
            echo "- Temporal address shape: valid host:port"
            echo "- Temporal TLS: required"
            printf '%s\n' '- Task queue: `shuddho-documents-v1`'
            printf '%s\n' '- Storage backend: `s3`'
            printf '%s\n' '- Bucket: `shuddho-coworker-staging`'
            echo "- This workflow performs no Render provisioning, provider calls, or paid-resource creation"
            echo "- Worker billing approval remains a separate human boundary"
          } >> "${GITHUB_STEP_SUMMARY}"
