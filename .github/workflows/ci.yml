name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Python lockfile
        run: uv lock --check
      - name: Install lightweight Python dependencies
        # Optional extras are excluded unless explicitly requested with
        # --extra/--all-extras. Passing --no-extra without --all-extras makes
        # uv reject the command instead of installing the lightweight set.
        run: uv sync --frozen --group dev
      - name: Check Python syntax
        run: >-
          uv run python -m py_compile
          services/api/shuddho_api/app.py
          services/api/shuddho_api/llm_provider.py
          services/api/shuddho_api/llm_gemma.py
      - name: Run Python tests
        run: uv run pytest -q

      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      - name: Build workspaces
        run: npm run build
      - name: Verify frontend rollout manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "apps/web-editor/dist/shuddho-rollout-manifest.json";
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          if (value.schema_version !== 1) throw new Error("Unexpected rollout manifest version");
          if (value.app !== "shuddho-web-editor") throw new Error("Unexpected rollout manifest app");
          if (value.source_revision !== process.env.GITHUB_SHA) throw new Error("Rollout manifest revision mismatch");
          if (value.microsoft_actions_enabled !== false) throw new Error("Microsoft frontend rollout must default off in CI");
          NODE

  coworker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: shuddho_coworker_test
          POSTGRES_USER: shuddho_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shuddho_test -d shuddho_coworker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHUDDHO_TEST_POSTGRES_URL: postgresql+psycopg://shuddho_test:ci-only-password@localhost:5432/shuddho_coworker_test
      SHUDDHO_TEMPORAL_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.7.22", enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install document rendering libraries and fonts
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          fonts-noto-core fonts-noto-cjk fonts-dejavu-core
          libreoffice-impress libreoffice-calc poppler-utils
      - name: Install coworker dependencies
        run: uv sync --frozen --group dev --extra coworker
      - name: Test accounts, real exports, PostgreSQL races, and Temporal recovery
        run: uv run --extra coworker pytest tests/test_coworker.py tests/test_action_registry.py tests/test_action_attachments.py tests/test_coworker_services.py tests/test_coworker_office.py tests/test_coworker_research.py tests/test_coworker_actions.py tests/test_microsoft_actions.py tests/test_coworker_postgres.py tests/test_coworker_temporal.py tests/test_agent_release_gates.py tests/test_staging_live_probe.py tests/test_staging_api_exercise.py tests/test_staging_temporal_recovery.py tests/test_staging_backup_restore.py tests/test_coworker_retention.py tests/test_staging_flag_rollback.py tests/test_staging_live_research.py tests/test_staging_live_google_actions.py tests/test_staging_live_microsoft_actions.py tests/test_staging_live_action_selection.py tests/test_staging_live_action_proposals.py tests/test_action_proposals_activation.py tests/test_action_selection_activation.py tests/test_microsoft_rollout_activation.py tests/test_cohort_release_gate.py tests/test_staging_cohort_admission.py tests/test_cohort_health_gate.py tests/test_cohort_observability_export.py tests/test_cohort_canary_progression.py tests/test_cohort_release_ledger.py tests/test_cohort_rollback_completion.py tests/test_cohort_recovery_verification.py tests/test_cohort_capacity_qualification.py tests/test_coworker_quality_eval.py tests/test_cohort_scale_review.py tests/test_cohort_scale_activation.py tests/test_cohort_post_scale_observation.py tests/test_provider_policy_compiler.py tests/test_provider_policy_activation.py -q
      - name: Evaluate bounded agent routing contracts
        run: uv run --extra coworker python scripts/agent_eval.py --min-pass-rate 1.0
      - name: Evaluate curated multilingual Coworker quality contracts
        run: uv run --extra coworker python scripts/coworker_quality_eval.py --min-pass-rate 1.0 --min-fact-recall 1.0
      - name: Render native Office files and verify recalculation after edits
        run: PYTHONPATH=.:tests uv run --extra coworker python tests/verify_office_native.py /tmp/shuddho-coworker-browser/screenshots/native
      - name: Prepare multilingual research export previews
        run: PYTHONPATH=.:tests uv run --extra coworker python tests/verify_research_exports.py /tmp/shuddho-coworker-browser/screenshots/research
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check coworker workflow in the browser
        env:
          SHUDDHO_BROWSER_TESTS: "true"
          SHUDDHO_TEST_WORKDIR: /tmp/shuddho-coworker-browser
          VITE_COWORKER_ENABLED: "true"
          VITE_SUPABASE_URL: https://identity.example.test
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test
          VITE_COWORKER_API_BASE_URL: http://127.0.0.1:8000
        run: |
          mkdir -p "$SHUDDHO_TEST_WORKDIR"
          PYTHONPATH=. uv run --extra coworker python tests/coworker_browser_server.py > "$SHUDDHO_TEST_WORKDIR/backend.log" 2>&1 &
          fixture_pid=$!
          npm run dev --workspace @shuddho/web-editor -- --host 127.0.0.1 > "$SHUDDHO_TEST_WORKDIR/frontend.log" 2>&1 &
          editor_pid=$!
          trap 'kill "$fixture_pid" "$editor_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node apps/web-editor/test/coworker-browser.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coworker-browser-screenshots
          path: /tmp/shuddho-coworker-browser/screenshots/
