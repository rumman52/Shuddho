name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate Python lockfile
        run: uv lock --check
      - name: Install lightweight Python dependencies
        # Optional extras are excluded unless explicitly requested with
        # --extra/--all-extras. Passing --no-extra without --all-extras makes
        # uv reject the command instead of installing the lightweight set.
        run: uv sync --frozen --group dev
      - name: Check Python syntax
        run: >-
          uv run python -m py_compile
          services/api/shuddho_api/app.py
          services/api/shuddho_api/llm_provider.py
          services/api/shuddho_api/llm_gemma.py
      - name: Run Python tests
        run: uv run pytest -q
      - name: Verify controlled-release contract
        run: uv run python -m scripts.release_contract_check

      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run JavaScript tests
        run: npm test
      # Keep the real proxy safety regressions in the fast job as well as the
      # mandatory coworker integration job: superseded long jobs must not hide
      # a private-network CONNECT regression behind a green build.
      - name: Test browser worker and public-IP CONNECT isolation
        run: node --test scripts/browser_worker_policy.test.mjs scripts/browser_pinned_proxy.test.mjs
      - name: Build workspaces
        run: npm run build
      - name: Verify frontend rollout manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "apps/web-editor/dist/shuddho-rollout-manifest.json";
          const value = JSON.parse(fs.readFileSync(path, "utf8"));
          if (value.schema_version !== 1) throw new Error("Unexpected rollout manifest version");
          if (value.app !== "shuddho-web-editor") throw new Error("Unexpected rollout manifest app");
          if (value.source_revision !== process.env.GITHUB_SHA) throw new Error("Rollout manifest revision mismatch");
          if (value.microsoft_actions_enabled !== false) throw new Error("Microsoft frontend rollout must default off in CI");
          NODE

  coworker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: shuddho_coworker_test
          POSTGRES_USER: shuddho_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shuddho_test -d shuddho_coworker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHUDDHO_TEST_POSTGRES_URL: postgresql+psycopg://shuddho_test:ci-only-password@localhost:5432/shuddho_coworker_test
      SHUDDHO_TEMPORAL_TESTS: "true"
      # Large coworker wheels (for example botocore/temporalio) can exceed uv's
      # default 30s HTTP timeout on a slow GitHub-hosted runner. Keep the
      # dependency install fail-closed while allowing bounded network slowness.
      UV_HTTP_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.7.22", enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install document rendering libraries and fonts
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          fonts-noto-core fonts-noto-cjk fonts-dejavu-core
          libreoffice-impress libreoffice-calc poppler-utils
      - name: Install coworker dependencies
        run: uv sync --frozen --group dev --extra coworker
      - name: Qualify PA-10 transient capacity admission retry without skips
        run: |
          uv run --extra coworker pytest tests/test_automations.py::test_transient_agent_capacity_rejection_keeps_occurrence_reclaimable -q -rs --junitxml=/tmp/pa10-capacity-admission.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/pa10-capacity-admission.xml --required-module tests.test_automations
      - name: Keep PA-10 capacity admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa10-capacity-admission-evidence
          path: /tmp/pa10-capacity-admission.xml

      - name: Qualify PA-10 deadline occurrence recovery without skips
        run: |
          uv run --extra coworker pytest tests/test_automations.py -k "deadline_occurrence_" -q -rs --junitxml=/tmp/pa10-deadline-recovery.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/pa10-deadline-recovery.xml --required-module tests.test_automations
      - name: Keep PA-10 deadline recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pa10-deadline-recovery-evidence
          path: /tmp/pa10-deadline-recovery.xml

      - name: Qualify staging backup/restore preflight before side effects
        run: |
          uv run --extra coworker pytest -q -rs --junitxml=/tmp/staging-backup-restore-preflight.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/staging-backup-restore-preflight.xml --required-module tests.test_staging_backup_restore
      - name: Keep staging backup/restore preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-backup-restore-preflight-evidence
          path: /tmp/staging-backup-restore-preflight.xml

      - name: Qualify A-03 legacy Temporal history replay without skips
        env:
          SHUDDHO_TEMPORAL_HISTORY_ARTIFACT_DIR: /tmp/a03-temporal-history-replay
        run: |
          uv run --extra coworker pytest tests/test_temporal_history_replay.py -q -rs --junitxml=/tmp/a03-temporal-history-replay.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/a03-temporal-history-replay.xml --required-module tests.test_temporal_history_replay
      - name: Keep A-03 Temporal history replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03-temporal-history-replay-evidence
          path: |
            /tmp/a03-temporal-history-replay/
            /tmp/a03-temporal-history-replay.xml
      - name: Qualify sandbox worker lifetime and cleanup without skips
        run: |
          uv run --extra coworker pytest tests/test_sandbox_worker_lifecycle.py -q -rs --junitxml=/tmp/sandbox-lifecycle.xml
          uv run python -m scripts.mandatory_test_gate /tmp/sandbox-lifecycle.xml --required-module tests.test_sandbox_worker_lifecycle
      - name: Build isolated sandbox worker image
        run: docker build -f Dockerfile.sandbox-worker -t shuddho-sandbox-worker:ci .
      - name: Run mandatory transaction safety regressions without skips
        run: |
          uv run --extra coworker pytest tests/test_transaction_chaos_qualification.py tests/test_transaction_chaos_matrix.py tests/test_transaction_execution_boundary_contract.py tests/test_transaction_reconciliation_boundary.py tests/test_transaction_mutation_guard.py -q -rs --junitxml=/tmp/transaction-safety.xml
          uv run python -m scripts.mandatory_test_gate /tmp/transaction-safety.xml --required-module tests.test_transaction_chaos_qualification
          uv run python -m scripts.mandatory_test_gate /tmp/transaction-safety.xml --required-module tests.test_transaction_chaos_matrix
          uv run python -m scripts.mandatory_test_gate /tmp/transaction-safety.xml --required-module tests.test_transaction_execution_boundary_contract
          uv run python -m scripts.mandatory_test_gate /tmp/transaction-safety.xml --required-module tests.test_transaction_reconciliation_boundary
          uv run python -m scripts.mandatory_test_gate /tmp/transaction-safety.xml --required-module tests.test_transaction_mutation_guard
          uv run pytest tests/test_mandatory_test_gate.py -q
      - name: Qualify committed Agent v3 decision recovery without skips
        run: |
          uv run --extra coworker pytest tests/test_agent_v3_decision_recovery.py tests/test_agent_v3_terminal_finality.py -q -rs --junitxml=/tmp/v3-decision-recovery.xml
          uv run python -m scripts.mandatory_test_gate /tmp/v3-decision-recovery.xml --required-module tests.test_agent_v3_decision_recovery
          uv run python -m scripts.mandatory_test_gate /tmp/v3-decision-recovery.xml --required-module tests.test_agent_v3_terminal_finality
      - name: Qualify PostgreSQL transaction fault boundaries without skips
        run: |
          uv run --extra coworker pytest tests/test_transaction_chaos_postgres.py -q -rs --junitxml=/tmp/transaction-postgres.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/transaction-postgres.xml --required-module tests.test_transaction_chaos_postgres
      - name: Keep PostgreSQL transaction fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-postgres-evidence
          path: /tmp/transaction-postgres.xml
      - name: Qualify transaction HTTP and hard worker recovery without skips
        env:
          SHUDDHO_TRANSACTION_CHAOS_POSTGRES_REQUIRED: "true"
          SHUDDHO_TRANSACTION_CHAOS_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --extra coworker pytest tests/test_transaction_chaos_temporal.py -q -rs -o junit_family=xunit1 --junitxml=/tmp/transaction-process.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/transaction-process.xml --required-module tests.test_transaction_chaos_temporal
      - name: Keep transaction process and Temporal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-process-evidence
          path: /tmp/transaction-process.xml
      - name: Check reviewer-attested CW-02 to CW-04 release gate without skips
        run: |
          uv run --extra coworker pytest tests/test_cw0204_qualification_gate.py -q -rs --junitxml=/tmp/cw0204-gate.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw0204-gate.xml --required-module tests.test_cw0204_qualification_gate
      - name: Keep CW-02 to CW-04 gate test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw0204-gate-tests
          path: /tmp/cw0204-gate.xml
      - name: Keep transaction safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-safety-evidence
          path: /tmp/transaction-safety.xml
      - name: Verify inert CW-10 code proposal persistence without skips
        run: |
          uv run --extra coworker pytest tests/test_agent_code_proposals.py tests/test_agent_code_proposal_persistence.py -q -rs --junitxml=/tmp/cw10-code-proposals.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw10-code-proposals.xml --required-module tests.test_agent_code_proposals
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw10-code-proposals.xml --required-module tests.test_agent_code_proposal_persistence
      - name: Keep inert code proposal safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw10-code-proposal-tests
          path: /tmp/cw10-code-proposals.xml
      - name: Verify durable conversation ownership and PostgreSQL races
        run: |
          uv run --extra coworker pytest tests/test_conversations.py tests/test_conversation_context.py tests/test_conversation_dispatch.py tests/test_coworker_postgres.py tests/test_coworker.py::test_simple_question_does_not_create_agent_run -q -rs --junitxml=/tmp/conversations.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/conversations.xml --required-module tests.test_conversations
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/conversations.xml --required-module tests.test_conversation_context
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/conversations.xml --required-module tests.test_conversation_dispatch
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/conversations.xml --required-module tests.test_coworker_postgres
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/conversations.xml --required-module tests.test_coworker
      - name: Verify connected-read authorization and revocation without skips
        run: |
          uv run --extra coworker pytest tests/test_connector_reads.py tests/test_permission_gateway.py -q -rs --junitxml=/tmp/connected-read-authority.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/connected-read-authority.xml --required-module tests.test_connector_reads
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/connected-read-authority.xml --required-module tests.test_permission_gateway
      - name: Keep connected-read authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-read-authority-evidence
          path: /tmp/connected-read-authority.xml
      - name: Qualify retrieved-context redaction and labels without skips
        run: |
          uv run --extra coworker pytest tests/test_context_policy_security.py tests/test_context_memory.py -q -rs --junitxml=/tmp/context-p02-security.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/context-p02-security.xml --required-module tests.test_context_policy_security
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/context-p02-security.xml --required-module tests.test_context_memory
      - name: Preserve retrieved-context security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-p02-security-evidence
          path: /tmp/context-p02-security.xml
      - name: Qualify CW-11 trusted skill registry and staging collector without skips
        run: |
          uv run --extra coworker pytest tests/test_cw11_registry.py tests/test_cw11_registry_postgres.py tests/test_cw11_staging_evidence.py -q -rs --junitxml=/tmp/cw11-registry.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw11-registry.xml --required-module tests.test_cw11_registry
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw11-registry.xml --required-module tests.test_cw11_registry_postgres
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw11-registry.xml --required-module tests.test_cw11_staging_evidence
      - name: Keep CW-11 registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw11-registry-evidence
          path: /tmp/cw11-registry.xml
      - name: Verify bounded Agent planner retry failures without skips
        run: |
          uv run --extra coworker pytest tests/test_coworker_temporal.py::test_agent_v3_model_failures_retry_within_bound_without_creating_work tests/test_coworker.py::test_agent_replan_activity_preserves_planner_retryability -q -rs --junitxml=/tmp/cw02-planner-retry.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw02-planner-retry.xml --required-module tests.test_coworker_temporal
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/cw02-planner-retry.xml --required-module tests.test_coworker
      - name: Keep planner retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cw02-planner-retry-evidence
          path: /tmp/cw02-planner-retry.xml
      - name: Verify grounded Runtime v3 handoff without skips
        run: |
          uv run --extra coworker pytest tests/test_coworker_temporal.py::test_agent_v3_deepseek_adapter_executes_grounded_multistep_workflow -q -rs --junitxml=/tmp/c01-v3-handoff.xml
          uv run --extra coworker python -m scripts.mandatory_test_gate /tmp/c01-v3-handoff.xml --required-module tests.test_coworker_temporal
      - name: Keep grounded Runtime v3 handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-v3-handoff-evidence
          path: /tmp/c01-v3-handoff.xml
      - name: Test accounts, real exports, PostgreSQL races, and Temporal recovery
        run: uv run --extra coworker pytest tests/test_coworker.py tests/test_action_registry.py tests/test_action_tool_reliability.py tests/test_agent_approval_boundary.py tests/test_document_sharing.py tests/test_staging_live_document_sharing.py tests/test_action_document_sharing_activation.py tests/test_staging_live_email_threading.py tests/test_action_email_threading_activation.py tests/test_staging_live_social_publishing.py tests/test_action_social_publishing_activation.py tests/test_linkedin_actions.py tests/test_action_recipients.py tests/test_staging_live_action_recipients.py tests/test_action_recipients_activation.py tests/test_action_attachments.py tests/test_coworker_services.py tests/test_coworker_office.py tests/test_coworker_research.py tests/test_coworker_actions.py tests/test_microsoft_actions.py tests/test_personal_transactions.py tests/test_transaction_domain.py tests/test_transaction_terms.py tests/test_transaction_api.py tests/test_transaction_reconciliation.py tests/test_restaurant_reservations.py tests/test_staging_live_restaurant_reservations.py tests/test_travel_quotes.py tests/test_travel_booking_bindings.py tests/test_travel_booking_contract.py tests/test_travel_booking_provider_qualification.py tests/test_travel_booking_registration_proposal.py tests/test_travel_booking_adapter.py tests/test_travel_booking_adapter_conformance.py tests/test_travel_booking_runtime_registration_review.py tests/test_transaction_runtime_registration_change_plan.py tests/test_transaction_capability_activation.py tests/test_tool_execution_reliability.py tests/test_agent_long_horizon_eval.py tests/test_core_agent_multilingual_eval.py tests/test_core_agent_eval_suite.py tests/test_core_agent_observability.py tests/test_shopping_carts.py tests/test_shopping_checkout_contract.py tests/test_hosted_transaction_handoff.py tests/test_shopping_checkout_provider_qualification.py tests/test_shopping_checkout_registration_proposal.py tests/test_shopping_checkout_adapter.py tests/test_shopping_checkout_adapter_conformance.py tests/test_shopping_checkout_runtime_registration_review.py tests/test_negotiation_cases.py tests/test_staging_live_personal_transactions.py tests/test_personal_transactions_activation.py tests/test_personal_transactions_release_ledger.py tests/test_staging_live_negotiation_proposal_promotion.py tests/test_negotiation_proposal_promotion_activation.py tests/test_negotiation_proposal_promotion_release_ledger.py tests/test_coworker_postgres.py tests/test_coworker_temporal.py tests/test_personal_goals.py tests/test_automations.py tests/test_web_push.py tests/test_browser_push_dispatch.py tests/test_context_memory.py tests/test_permission_gateway.py tests/test_connector_reads.py tests/test_browser_broker.py tests/test_sandbox_control_plane.py tests/test_agent_release_gates.py tests/test_staging_live_probe.py tests/test_staging_api_exercise.py tests/test_staging_temporal_recovery.py tests/test_staging_backup_restore.py tests/test_coworker_retention.py tests/test_staging_flag_rollback.py tests/test_staging_live_research.py tests/test_staging_live_google_actions.py tests/test_staging_live_microsoft_actions.py tests/test_staging_live_action_attachments.py tests/test_staging_live_action_reminders.py tests/test_staging_live_action_selection.py tests/test_staging_live_action_proposals.py tests/test_action_proposals_activation.py tests/test_action_attachments_activation.py tests/test_action_reminders_activation.py tests/test_action_selection_activation.py tests/test_microsoft_rollout_activation.py tests/test_cohort_release_gate.py tests/test_staging_cohort_admission.py tests/test_cohort_health_gate.py tests/test_cohort_observability_export.py tests/test_cohort_canary_progression.py tests/test_cohort_release_ledger.py tests/test_cohort_rollback_completion.py tests/test_cohort_recovery_verification.py tests/test_cohort_capacity_qualification.py tests/test_coworker_quality_eval.py tests/test_cohort_scale_review.py tests/test_cohort_scale_activation.py tests/test_cohort_post_scale_observation.py tests/test_provider_policy_compiler.py tests/test_provider_policy_activation.py -q
      - name: Qualify brokered Agent browser tool without skips
        run: |
          uv run --extra coworker pytest tests/test_agent_browser_tool.py -q -rs --junitxml=/tmp/cw09-agent-browser.xml
          uv run python -m scripts.mandatory_test_gate /tmp/cw09-agent-browser.xml --required-module tests.test_agent_browser_tool
      - name: Evaluate bounded agent routing contracts
        run: uv run --extra coworker python scripts/agent_eval.py --min-pass-rate 1.0
      - name: Qualify Core Agent request routing
        run: uv run --extra coworker python scripts/core_agent_route_eval.py --min-pass-rate 0.95
      - name: Qualify multilingual Core Agent route equivalence
        run: uv run --extra coworker python scripts/core_agent_multilingual_eval.py --min-pass-rate 1.0
      - name: Run permanent Core Agent evaluation suite
        run: uv run --extra coworker python -m scripts.core_agent_eval_suite --min-scenarios 300
      - name: Qualify long-horizon Agent workflows
        run: >-
          uv run --extra coworker python scripts/agent_long_horizon_eval.py
          --min-scenario-completion-rate 1.0
          --min-milestone-completion-rate 1.0
          --min-long-horizon-completion-rate 1.0
          --min-transaction-completion-rate 1.0
      - name: Evaluate curated multilingual Coworker quality contracts
        run: uv run --extra coworker python scripts/coworker_quality_eval.py --min-pass-rate 1.0 --min-fact-recall 1.0
      - name: Render native Office files and verify recalculation after edits
        run: PYTHONPATH=.:tests uv run --extra coworker python tests/verify_office_native.py /tmp/shuddho-coworker-browser/screenshots/native
      - name: Prepare multilingual research export previews
        run: PYTHONPATH=.:tests uv run --extra coworker python tests/verify_research_exports.py /tmp/shuddho-coworker-browser/screenshots/research
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - name: Test isolated browser worker policy and real HTTPS CONNECT boundary
        run: node --test scripts/browser_worker_policy.test.mjs scripts/browser_pinned_proxy.test.mjs
      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check coworker workflow in the browser
        env:
          SHUDDHO_BROWSER_TESTS: "true"
          SHUDDHO_TEST_WORKDIR: /tmp/shuddho-coworker-browser
          VITE_COWORKER_ENABLED: "true"
          VITE_SUPABASE_URL: https://identity.example.test
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test
          VITE_COWORKER_API_BASE_URL: http://127.0.0.1:8000
        run: |
          mkdir -p "$SHUDDHO_TEST_WORKDIR"
          PYTHONPATH=. uv run --extra coworker python tests/coworker_browser_server.py > "$SHUDDHO_TEST_WORKDIR/backend.log" 2>&1 &
          fixture_pid=$!
          npm run dev --workspace @shuddho/web-editor -- --host 127.0.0.1 > "$SHUDDHO_TEST_WORKDIR/frontend.log" 2>&1 &
          editor_pid=$!
          trap 'kill "$fixture_pid" "$editor_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node apps/web-editor/test/coworker-browser.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coworker-browser-screenshots
          path: /tmp/shuddho-coworker-browser/screenshots/

  ci-merge-gate:
    name: ci-merge-gate
    if: always()
    needs:
      - test-and-build
      - coworker
      - governance-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require complete CI success
        env:
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
          COWORKER_RESULT: ${{ needs.coworker.result }}
          GOVERNANCE_AUDIT_RESULT: ${{ needs.governance-audit.result }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "test-and-build=$TEST_AND_BUILD_RESULT"
          echo "coworker=$COWORKER_RESULT"
          echo "governance-audit=$GOVERNANCE_AUDIT_RESULT"
          if [ "$TEST_AND_BUILD_RESULT" != "success" ] || [ "$COWORKER_RESULT" != "success" ]; then
            echo "CI merge gate failed: every required upstream job must succeed."
            exit 1
          fi
          case "$CI_EVENT_NAME" in
            push)
              if [ "$GOVERNANCE_AUDIT_RESULT" != "success" ]; then
                echo "CI merge gate failed: main governance must be confirmed on push."
                exit 1
              fi
              ;;
            pull_request|pull_request_review)
              # The read-only audit is push-only. Never give PR code an admin
              # credential to inspect hidden ruleset bypass settings.
              if [ "$GOVERNANCE_AUDIT_RESULT" != "skipped" ] && [ "$GOVERNANCE_AUDIT_RESULT" != "success" ]; then
                echo "CI merge gate failed: unexpected governance audit result."
                exit 1
              fi
              ;;
            *)
              echo "CI merge gate failed: unsupported workflow event."
              exit 1
              ;;
          esac
          echo "Required upstream checks passed; PR review is checked separately."
      - name: Require independent current-head review
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m scripts.independent_review_gate \
            --repository "$REVIEW_REPOSITORY" \
            --pull-request "$REVIEW_PR_NUMBER" \
            --head-sha "$REVIEW_HEAD_SHA"

  # Required post-merge tripwire: its failure also fails ci-merge-gate on push.
  # Native rulesets must prevent unsafe merges; this audit cannot undo a merge.
  governance-audit:
    name: governance-audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active V-01 main governance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.main_protection_audit --repository "${{ github.repository }}"
