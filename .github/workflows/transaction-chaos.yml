name: Transaction Chaos Qualification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  transaction-chaos:
    name: Transaction chaos safety suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run transaction chaos qualification
        run: |
          pytest tests/test_transaction_chaos_qualification.py -q -rs
