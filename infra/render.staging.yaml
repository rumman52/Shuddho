# PA-10 controlled staging only.
# Do not sync this Blueprint until managed identity, private S3-compatible
# storage, Temporal TLS credentials, and the staging worker compute plan have
# been explicitly reviewed. Production flags remain separate.

services:
  - type: web
    runtime: python
    name: shuddho-api-staging
    repo: https://github.com/rumman52/Shuddho
    branch: main
    region: oregon
    plan: free
    autoDeployTrigger: off
    buildCommand: pip install uv && uv sync --frozen --no-dev --extra coworker
    startCommand: uv run --extra coworker uvicorn services.api.shuddho_api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SHUDDHO_COWORKER_ENV
        value: staging
      - key: SHUDDHO_COWORKER_DATABASE_URL
        fromDatabase:
          name: shuddho-staging-db
          property: connectionString
      - key: SHUDDHO_AUTH_ISSUER
        sync: false
      - key: SHUDDHO_AUTH_AUDIENCE
        value: authenticated
      - key: SHUDDHO_COWORKER_STORAGE
        value: s3
      - key: SHUDDHO_COWORKER_BUCKET
        sync: false
      - key: SHUDDHO_COWORKER_S3_ENDPOINT
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SHUDDHO_TEMPORAL_ADDRESS
        sync: false
      - key: SHUDDHO_TEMPORAL_NAMESPACE
        sync: false
      - key: SHUDDHO_TEMPORAL_API_KEY
        sync: false
      - key: SHUDDHO_TEMPORAL_TLS
        value: "true"
      - key: SHUDDHO_TEMPORAL_TASK_QUEUE
        value: shuddho-documents-v1
      - key: DEEPSEEK_API_KEY
        sync: false
      # Day 1: pin the existing bounded source policy on API and worker.
      # No capability activation or paid model call is authorized by this file.
      - key: SHUDDHO_LLM_PROVIDER
        value: "deepseek"
      - key: DEEPSEEK_MODEL
        value: "deepseek-flash"
      - key: GEMMA_MODEL
        value: "gemma-4-26b-a4b-it"
      - key: SHUDDHO_PROVIDER_MAX_CONCURRENT_CALLS
        value: "8"
      - key: SHUDDHO_PROVIDER_MAX_CONCURRENT_PER_WORKSPACE
        value: "2"
      - key: SHUDDHO_PROVIDER_MAX_RESERVED_TOKENS
        value: "800000"
      - key: SHUDDHO_PROVIDER_MAX_RESERVED_TOKENS_PER_WORKSPACE
        value: "200000"
      - key: SHUDDHO_PROVIDER_DAILY_TOKEN_BUDGET
        value: "5000000"
      - key: SHUDDHO_PROVIDER_LEASE_SECONDS
        value: "120"
      - key: SHUDDHO_COWORKER_DAILY_TOKENS
        value: "500000"
      - key: SHUDDHO_COWORKER_TASK_TOKENS
        value: "100000"
      - key: SHUDDHO_AGENT_MAX_MODEL_CALLS_PER_RUN
        value: "12"
      - key: SHUDDHO_AGENT_MAX_TOKENS_PER_RUN
        value: "250000"
      - key: SHUDDHO_AGENT_MAX_TOOL_CALLS_PER_RUN
        value: "8"
      - key: SHUDDHO_AGENT_MAX_COST_MICROUSD_PER_RUN
        value: "1000000"
      - key: SHUDDHO_AGENT_RUN_TIMEOUT_SECONDS
        value: "1800"
      - key: SHUDDHO_AGENT_MAX_PARALLEL_STEPS
        value: "2"
      - key: SHUDDHO_AGENT_V3_PLANNER_CALLS
        value: "4"
      - key: SHUDDHO_AGENT_V3_PLANNER_TOKEN_BUDGET
        value: "24000"
      - key: SHUDDHO_AGENT_PLANNER_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: SHUDDHO_AGENT_CONTEXT_ITEMS
        value: "5"
      - key: SHUDDHO_AGENT_CONTEXT_BYTES
        value: "12288"
      - key: SHUDDHO_COWORKER_ACTIVE_TASKS
        value: "2"
      - key: SHUDDHO_COWORKER_ENABLED
        value: "false"
      - key: SHUDDHO_WORK_SERVICES_ENABLED
        value: "false"
      - key: SHUDDHO_ARTIFACT_SERVICES_ENABLED
        value: "false"
      - key: SHUDDHO_AGENT_RUNTIME_ENABLED
        value: "false"
      - key: SHUDDHO_AGENT_RUNTIME_V3_ENABLED
        value: "false"
      - key: SHUDDHO_PERSONAL_GOALS_ENABLED
        value: "false"
      - key: SHUDDHO_AUTOMATIONS_ENABLED
        value: "false"
      - key: SHUDDHO_AGENT_INTELLIGENT_PLANNER_ENABLED
        value: "false"
      - key: SHUDDHO_CONTEXT_RETRIEVAL_ENABLED
        value: "false"
      - key: SHUDDHO_ACTIONS_ENABLED
        value: "false"
      - key: SHUDDHO_CONNECTOR_TRUST_BOUNDARY_ENABLED
        value: "false"
      - key: SHUDDHO_CONNECTOR_READS_ENABLED
        value: "false"
      - key: SHUDDHO_BROWSER_PUSH_ENABLED
        value: "false"
