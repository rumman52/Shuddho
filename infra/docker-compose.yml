services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shuddho
      POSTGRES_PASSWORD: shuddho
      POSTGRES_DB: shuddho
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://shuddho:shuddho@postgres:5432/shuddho
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      API_AUTH_TOKEN: dev-token
    depends_on: [postgres, redis]
    ports: ["4000:4000"]
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws/docs
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres-data:
